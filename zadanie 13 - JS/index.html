<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
            <h1 id="hello">Witaj na mojej stronie</h1>

        <button id="send" onclick="send()">Wyślij</button>
    <script>
        //textContent
        //getElemendById
        //onClick ALBO addEventListener
        function send(){
            document.getElementById("hello").textContent = "Udało ci się!"
        }
    </script>

    <hr>
    <form>
        <label for="price">Cena</label>
        <input type="number" id="price" name="price"><br>

        <label for="amount">Ilość</label>
        <input type="number" id="amount" name="amount"><br>
        <button type="button" id="calculate" onclick="oblicz()">Oblicz</button>

        <p id="result"></p>
    </form>

    <script>
        function oblicz(){
            let price = document.getElementById("price").value;
            let amount = document.getElementById("amount").value;
            let result = price * amount;
            document.getElementById("result").textContent = "Cena to: " + result + "zł";
        }
    </script>

    <hr>
    <form>
        <label for="length">Długość</label>
        <input type="number" id="length" name="length"><br>

        <label for="width">Szerokość</label>
        <input type="number" id="width" name="width"><br>

        <button type="button" id="calculate" onclick="obliczenie()">Oblicz</button>

        <p id="results"></p>
    </form>
    
    <script>
        function obliczenie(){
            let length = document.getElementById("length").value;
            let width = document.getElementById("width").value;
            let a = (length/100) * (width/100);
            document.getElementById("results").textContent = "Powierzchnia płytki to: " + a + " metrów kwadratowych";
        }
    </script>
</body>
</html>
